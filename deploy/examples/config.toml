[server]
listen_address = "127.0.0.1"
port = 2095
read_header_timeout = "5s"
shutdown_timeout = "10s"

[logging]
level = "info"
format = "text"

[storage]
database_path = "/var/lib/m-ui/m-ui.db"
master_key_path = "/var/lib/m-ui/master.key"

[security]
session_ttl = "12h"
cookie_secure = false

[panel]
title = "m-ui"
ui_language = "en-US"
public_host = "localhost"

[mihomo]
binary_path = "/usr/local/bin/mihomo"
config_directory = "/etc/mihomo"
config_path = "/etc/mihomo/config.yaml"
controller_address = "127.0.0.1:9090"
# Optional first-run bootstrap value. The installer writes a random secret,
# m-ui encrypts it into SQLite, then the installer clears this field after the
# first healthy start. Protect this file as root:m-ui 0640.
controller_secret = ""
service_name = "mihomo.service"
revision_directory = "/var/lib/m-ui/revisions"
history_limit = 20
