services:
  m-ui:
    image: ghcr.io/aethersailor/m-ui:${M_UI_IMAGE_TAG:-edge}
    container_name: m-ui
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      M_UI_PUBLIC_HOST: localhost
      M_UI_MIHOMO_CHANNEL: release
      M_UI_MIHOMO_AUTO_UPDATE: "off"
      M_UI_MIHOMO_CHECK_INTERVAL: 24h
    volumes:
      - m-ui-etc:/etc/m-ui
      - mihomo-etc:/etc/mihomo
      - m-ui-data:/var/lib/m-ui
      - mihomo-data:/var/lib/mihomo
    tmpfs:
      - /tmp:mode=1777

volumes:
  m-ui-etc:
  mihomo-etc:
  m-ui-data:
  mihomo-data:
