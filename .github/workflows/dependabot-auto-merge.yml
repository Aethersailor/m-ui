name: Trusted Security Bot Auto Merge

on:
  workflow_run:
    workflows:
      - Smart Build & Release
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: trusted-security-bot-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable verified bot PR auto-merge
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the live PR and enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          REPOSITORY: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number="$(jq -er '.[0].number' <<<"$PULL_REQUESTS_JSON")"
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          author="$(jq -r '.user.login' <<<"$pr_json")"

          case "$author" in
            "dependabot[bot]"|"github-advanced-security[bot]") ;;
            *)
              echo "Skipping untrusted PR author: $author"
              exit 0
              ;;
          esac

          test "$(jq -r '.state' <<<"$pr_json")" = open
          test "$(jq -r '.draft' <<<"$pr_json")" = false
          test "$(jq -r '.base.ref' <<<"$pr_json")" = "$DEFAULT_BRANCH"
          test "$(jq -r '.head.repo.full_name' <<<"$pr_json")" = "$REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$RUN_HEAD_SHA"

          pr_url="$(jq -r '.html_url' <<<"$pr_json")"
          gh pr merge --auto --squash "$pr_url"
