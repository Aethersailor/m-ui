name: Trusted Security Bot Auto Merge

on:
  workflow_run:
    workflows:
      - Smart Build & Release
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: trusted-security-bot-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  handle:
    name: Handle verified bot PR result
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the live PR, retry failures, or enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PULL_REQUESTS_JSON: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          pr_number="$(jq -er '.[0].number' <<<"$PULL_REQUESTS_JSON")"
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          author="$(jq -r '.user.login' <<<"$pr_json")"

          case "$author" in
            "dependabot[bot]"|"github-advanced-security[bot]") ;;
            *)
              echo "Skipping untrusted PR author: $author"
              exit 0
              ;;
          esac

          if [ "$(jq -r '.state' <<<"$pr_json")" != open ]; then
            echo "PR #$pr_number is no longer open; no merge action is needed."
            exit 0
          fi

          if [ "$(jq -r '.draft' <<<"$pr_json")" != false ] ||
             [ "$(jq -r '.base.ref' <<<"$pr_json")" != "$DEFAULT_BRANCH" ] ||
             [ "$(jq -r '.head.repo.full_name' <<<"$pr_json")" != "$REPOSITORY" ]; then
            echo "PR #$pr_number is outside the trusted auto-merge scope."
            exit 0
          fi

          if [ "$(jq -r '.head.sha' <<<"$pr_json")" != "$RUN_HEAD_SHA" ]; then
            echo "Skipping stale result for PR #$pr_number at $RUN_HEAD_SHA."
            exit 0
          fi

          pr_url="$(jq -r '.html_url' <<<"$pr_json")"
          case "$RUN_CONCLUSION" in
            success)
              gh pr merge --auto --squash "$pr_url"
              ;;
            failure)
              if [ "$RUN_ATTEMPT" -lt 3 ]; then
                echo "Retrying failed jobs for PR #$pr_number (attempt $RUN_ATTEMPT of 3)."
                gh run rerun --failed "$RUN_ID" --repo "$REPOSITORY"
              else
                echo "::error::PR #$pr_number still fails after $RUN_ATTEMPT attempts."
                exit 1
              fi
              ;;
            *)
              echo "No action for workflow conclusion: $RUN_CONCLUSION"
              ;;
          esac
