name: Release

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: Select an explicit version or calculate the next semantic version
        required: true
        default: explicit
        type: choice
        options:
          - explicit
          - patch
          - minor
          - major
      version:
        description: Optional vX.Y.Z or X.Y.Z; required for explicit mode
        required: false
        default: ''
        type: string
      target_ref:
        description: Remote ref to release, defaulting to master
        required: true
        default: master
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease (never updates latest)
        required: true
        default: false
        type: boolean
      confirm:
        description: Type RELEASE to authorize tag, registry, and Release publication
        required: true
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.guard.outputs.version }}
      target_sha: ${{ steps.guard.outputs.target_sha }}
      target_ref: ${{ steps.guard.outputs.target_ref }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      sha12: ${{ steps.guard.outputs.sha12 }}

    steps:
      - name: Check out exact target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Resolve version and enforce remote target identity
        id: guard
        env:
          VERSION_INPUT: ${{ inputs.version }}
          VERSION_MODE: ${{ inputs.version_mode }}
          TARGET_REF: ${{ inputs.target_ref }}
          PRERELEASE: ${{ inputs.prerelease }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = RELEASE
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          git fetch --no-tags --prune origin "$TARGET_REF"
          TARGET_SHA="$(git rev-parse HEAD)"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$TARGET_REF" = master ]; then
            test "$(git rev-parse origin/master)" = "$TARGET_SHA"
          fi
          case "$VERSION_MODE" in
            explicit|patch|minor|major) ;;
            *) echo "unsupported version mode" >&2; exit 1 ;;
          esac
          normalize_version() {
            local candidate="$1"
            candidate="${candidate#v}"
            [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf 'v%s\n' "$candidate"
          }
          if [ "$VERSION_MODE" = explicit ]; then
            test -n "$VERSION_INPUT"
            VERSION="$(normalize_version "$VERSION_INPUT")"
          else
            latest="$(git ls-remote --tags origin 'refs/tags/v*' |
              awk -F/ '$NF !~ /\^\{\}$/ && $NF ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {print $NF}' |
              sort -V | tail -n 1)"
            if [ -z "$latest" ] && [ "$VERSION_MODE" = patch ]; then
              VERSION=v0.1.0
            else
              [ -n "$latest" ] || latest=v0.1.0
              IFS=. read -r major minor patch <<< "${latest#v}"
              major=$((10#$major))
              minor=$((10#$minor))
              patch=$((10#$patch))
              case "$VERSION_MODE" in
                patch) patch=$((patch + 1)) ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                major) major=$((major + 1)); minor=0; patch=0 ;;
              esac
              VERSION="v${major}.${minor}.${patch}"
            fi
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"
          then
            echo "release tag already exists" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1
          then
            echo "GitHub Release already exists" >&2
            exit 1
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'target_ref=%s\n' "$TARGET_REF"
            printf 'prerelease=%s\n' "$PRERELEASE"
            printf 'sha12=%s\n' "${TARGET_SHA:0:12}"
          } >>"$GITHUB_OUTPUT"

      - name: Lock official Mihomo release identity
        env:
          M_UI_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-mihomo.sh --output packaging/bootstrap

      - name: Upload locked bootstrap identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity-${{ steps.guard.outputs.sha12 }}
          path: packaging/bootstrap/identity.json
          if-no-files-found: error
          retention-days: 7

  bootstrap:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out exact target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Download locked bootstrap identity
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-identity-${{ needs.validate.outputs.sha12 }}
          path: packaging/bootstrap

      - name: Verify and run the locked native Mihomo bootstrap
        run: |
          bash scripts/resolve-mihomo.sh \
            --output packaging/bootstrap \
            --architecture "${{ matrix.arch }}"
          packaging/bootstrap/linux_${{ matrix.arch }}/mihomo -v
          packaging/bootstrap/linux_${{ matrix.arch }}/mihomo \
            -t -f internal/publisher/testdata/vless_reality.golden.yaml

      - name: Upload verified native bootstrap
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bootstrap-${{ needs.validate.outputs.sha12 }}-${{ matrix.arch }}
          path: packaging/bootstrap
          if-no-files-found: error
          retention-days: 7

  assets:
    needs:
      - validate
      - bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Create local release tag
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: git tag "$VERSION"

      - name: Download verified bootstraps
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-bootstrap-${{ needs.validate.outputs.sha12 }}-*
          path: packaging/bootstrap
          merge-multiple: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run complete source verification
        env:
          M_UI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build
          go test ./...
          go vet ./...
          go test -race ./...
          make smoke

      - name: Install verified Syft
        run: |
          syft_dir="$RUNNER_TEMP/m-ui-syft"
          mkdir -p "$syft_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$syft_dir/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.44.0/syft_1.44.0_linux_amd64.tar.gz
          echo "0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a  $syft_dir/syft.tar.gz" |
            sha256sum --check
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          sudo install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Build release archives, packages, checksums, and SBOMs
        uses: goreleaser/goreleaser-action@4c6ab561adb47e50c45ef534e2155934e91c40c1 # v7.2.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish

      - name: Add verified lifecycle scripts and regenerate checksums
        run: |
          cp scripts/manage.sh scripts/install.sh scripts/uninstall.sh dist/
          cp packaging/bootstrap/identity.json \
            dist/MIHOMO_BOOTSTRAP_IDENTITY.json
          (
            cd dist
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.apk' \
                 -o -name '*.sbom.spdx.json' -o -name 'manage.sh' \
                 -o -name 'install.sh' -o -name 'uninstall.sh' \
                 -o -name 'MIHOMO_BOOTSTRAP_IDENTITY.json' \) \
              -printf '%f\n' | sort |
              xargs sha256sum >SHA256SUMS
          )

      - name: Verify release artifact matrix
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 2
          test -s dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -name '*.sbom.spdx.json' | wc -l)" -ge 6
          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ needs.validate.outputs.sha12 }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS
            dist/*.sbom.spdx.json
            dist/manage.sh
            dist/install.sh
            dist/uninstall.sh
            dist/MIHOMO_BOOTSTRAP_IDENTITY.json
          if-no-files-found: error
          retention-days: 7

  image:
    needs:
      - validate
      - bootstrap
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            syft_sha: 0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a
          - arch: arm64
            runner: ubuntu-24.04-arm
            syft_sha: 6f6cdcdc695721d91ce756e3b5bc3e3416599c464101f5e32e9c3f33054ee6d9
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35

    steps:
      - name: Check out exact target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Download verified native bootstrap
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bootstrap-${{ needs.validate.outputs.sha12 }}-${{ matrix.arch }}
          path: packaging/bootstrap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Install verified native Syft
        run: |
          syft_dir="$RUNNER_TEMP/m-ui-syft"
          mkdir -p "$syft_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v1.44.0/syft_1.44.0_linux_${{ matrix.arch }}.tar.gz"
          echo "${{ matrix.syft_sha }}  $syft_dir/syft.tar.gz" | sha256sum --check
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          sudo install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Build and smoke-test native image
        env:
          IMAGE: m-ui:${{ needs.validate.outputs.sha12 }}-${{ matrix.arch }}
        run: |
          docker build \
            --platform linux/${{ matrix.arch }} \
            --build-arg VERSION=${{ needs.validate.outputs.version }} \
            --build-arg REVISION=${{ needs.validate.outputs.target_sha }} \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "$IMAGE" .
          bash scripts/docker-smoke.sh "$IMAGE"
          syft "$IMAGE" \
            -o spdx-json=m-ui-image-${{ matrix.arch }}.sbom.spdx.json
          docker save "$IMAGE" | gzip -1 >m-ui-image-${{ matrix.arch }}.tar.gz
          sha256sum m-ui-image-${{ matrix.arch }}.tar.gz \
            m-ui-image-${{ matrix.arch }}.sbom.spdx.json \
            >docker-SHA256SUMS

      - name: Upload native image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ needs.validate.outputs.sha12 }}-${{ matrix.arch }}
          path: |
            m-ui-image-${{ matrix.arch }}.tar.gz
            docker-SHA256SUMS
            m-ui-image-${{ matrix.arch }}.sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  package-test:
    needs:
      - validate
      - assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            format: deb
          - image: ubuntu:24.04
            format: deb
          - image: alpine:3.20
            format: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets-${{ needs.validate.outputs.sha12 }}
          path: release

      - name: Test native package lifecycle
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            -e FORMAT \
            -v "$PWD/release:/release:ro" \
            "$IMAGE" sh -euxc '
              package="$(find /release -maxdepth 1 \
                -name "*linux_amd64.${FORMAT}" -print -quit)"
              test -n "$package"
              if [ "$FORMAT" = deb ]; then
                apt-get update
                apt-get install -y "$package"
                run_core="runuser -u m-ui --"
              else
                apk add --allow-untrusted "$package"
                run_core="su-exec m-ui"
              fi
              test -x /usr/bin/m-ui
              test -x /var/lib/m-ui/core/current/mihomo
              $run_core /usr/bin/m-ui core status \
                --json --config /etc/m-ui/config.toml
              printf "%s\n" preserve > /var/lib/m-ui/package-test-marker
              /usr/lib/m-ui/manage.sh uninstall
              test ! -e /usr/bin/m-ui
              test -f /var/lib/m-ui/package-test-marker
              if [ "$FORMAT" = deb ]; then
                apt-get install -y "$package"
              else
                apk add --allow-untrusted "$package"
              fi
              test -f /var/lib/m-ui/package-test-marker
            '

  publish:
    if: inputs.confirm == 'RELEASE'
    needs:
      - validate
      - assets
      - image
      - package-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the verified target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets-${{ needs.validate.outputs.sha12 }}
          path: release

      - name: Download native images
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-image-${{ needs.validate.outputs.sha12 }}-*
          path: images
          merge-multiple: true

      - name: Validate assets, publish candidate images, create tag, and draft Release
        id: publish-images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHA12: ${{ needs.validate.outputs.sha12 }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/m-ui-release-state"
          rm -rf "$state_dir"
          mkdir -p "$state_dir"
          printf 'version=%s\ntarget_sha=%s\n' "$VERSION" "$TARGET_SHA" >"$state_dir/metadata"
          (
            cd release
            sha256sum --check SHA256SUMS
          )
          echo "$GH_TOKEN" |
            docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="release-candidate-${GITHUB_RUN_ID}"
          for arch in amd64 arm64; do
            gzip -dc "images/m-ui-image-${arch}.tar.gz" | docker load
            source="m-ui:${SHA12}-${arch}"
            docker tag "$source" "${repository}:${candidate}-${arch}"
            docker push "${repository}:${candidate}-${arch}"
          done
          docker buildx imagetools create \
            --tag "${repository}:${candidate}" \
            "${repository}:${candidate}-amd64" \
            "${repository}:${candidate}-arm64"
          docker buildx imagetools inspect "${repository}:${candidate}" \
            --raw >release/CANDIDATE_IMAGE_MANIFEST.json
          jq -e '
            [.manifests[].platform.architecture] |
            sort == ["amd64", "arm64"]
          ' release/CANDIDATE_IMAGE_MANIFEST.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$TARGET_SHA" -m "m-ui $VERSION"
          git push origin "refs/tags/$VERSION"
          touch "$state_dir/tag-created"

          release_args=("$VERSION" release/* --draft --target "$TARGET_SHA" \
            --title "m-ui $VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
          touch "$state_dir/release-created"

      - name: Prepare candidate manifest and attestation inputs
        id: formal-images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHA12: ${{ needs.validate.outputs.sha12 }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="release-candidate-${GITHUB_RUN_ID}"
          docker buildx imagetools inspect "${repository}:${candidate}" \
            --raw >release/IMAGE_MANIFEST.json
          cp images/m-ui-image-*.sbom.spdx.json release/
          jq -e '
            [.manifests[].platform.architecture] |
            sort == ["amd64", "arm64"]
          ' release/IMAGE_MANIFEST.json
          (
            cd release
            sha256sum IMAGE_MANIFEST.json \
              m-ui-image-*.sbom.spdx.json >>SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          digest="$(docker buildx imagetools inspect \
            "${repository}:${candidate}" --format '{{ .Manifest.Digest }}')"
          printf 'subject_name=%s\n' "$repository" >>"$GITHUB_OUTPUT"
          printf 'subject_digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Attest release assets
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.apk
            release/SHA256SUMS
            release/*.sbom.spdx.json
            release/manage.sh
            release/install.sh
            release/uninstall.sh
            release/IMAGE_MANIFEST.json
            release/m-ui-image-*.sbom.spdx.json
            release/MIHOMO_BOOTSTRAP_IDENTITY.json

      - name: Attest multi-architecture image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ steps.formal-images.outputs.subject_name }}
          subject-digest: ${{ steps.formal-images.outputs.subject_digest }}
          push-to-registry: true

      - name: Promote attested images and preserve prior tags
        id: formal-promotion
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHA12: ${{ needs.validate.outputs.sha12 }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/m-ui-release-state"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="release-candidate-${GITHUB_RUN_ID}"
          version_without_v="${VERSION#v}"
          IFS=. read -r major minor _ <<< "$version_without_v"
          base_tags=("$VERSION" "$version_without_v" "${major}.${minor}" "$major")
          all_tags=("${base_tags[@]}" "sha-${SHA12}")
          if [ "$PRERELEASE" != true ]; then
            all_tags+=(latest)
          fi
          snapshot="$state_dir/formal-tag-snapshot"
          : >"$snapshot"
          snapshot_tag() {
            local tag="$1"
            local digest
            digest="$(docker buildx imagetools inspect \
              "${repository}:${tag}" --format '{{ .Manifest.Digest }}' \
              2>/dev/null || true)"
            if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf '%s\t%s\n' "$tag" "$digest" >>"$snapshot"
            else
              printf '%s\t-\n' "$tag" >>"$snapshot"
            fi
          }
          for tag in "${all_tags[@]}"; do
            snapshot_tag "$tag"
            snapshot_tag "${tag}-amd64"
            snapshot_tag "${tag}-arm64"
          done
          touch "$state_dir/promotion-started"

          for arch in amd64 arm64; do
            for tag in "${all_tags[@]}"; do
              docker buildx imagetools create \
                --tag "${repository}:${tag}-${arch}" \
                "${repository}:${candidate}-${arch}"
            done
          done
          for tag in "${all_tags[@]}"; do
            docker buildx imagetools create \
              --tag "${repository}:${tag}" \
              "${repository}:${candidate}"
          done
          candidate_digest="$(docker buildx imagetools inspect \
            "${repository}:${candidate}" --format '{{ .Manifest.Digest }}')"
          promoted_digest="$(docker buildx imagetools inspect \
            "${repository}:${VERSION}" --format '{{ .Manifest.Digest }}')"
          test "$candidate_digest" = "$promoted_digest"
          (
            cd release
            sha256sum --check SHA256SUMS
          )

      - name: Complete verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release upload "$VERSION" \
            release/SHA256SUMS release/IMAGE_MANIFEST.json \
            release/m-ui-image-*.sbom.spdx.json \
            --clobber
          gh release edit "$VERSION" --draft=false
          touch "$RUNNER_TEMP/m-ui-release-state/release-complete"

      - name: Clean up candidate and failed formal release state
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set +e
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          candidate="release-candidate-${GITHUB_RUN_ID}"
          state_dir="$RUNNER_TEMP/m-ui-release-state"

          cleanup_status=success
          cleanup_summary=()
          candidate_tags=(
            "$candidate"
            "$candidate-amd64"
            "$candidate-arm64"
          )
          declare -A deleted_version_ids=()

          note_cleanup() {
            cleanup_summary+=("$1")
          }

          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          package_versions_endpoint=
          owner_type="$(gh api "/users/${owner}" -q .type 2>/dev/null || true)"
          case "$owner_type" in
            User)
              package_versions_endpoint="/users/${owner}/packages/container/${package}/versions"
              ;;
            Organization)
              package_versions_endpoint="/orgs/${owner}/packages/container/${package}/versions"
              ;;
            *)
              echo "::warning::cannot resolve GitHub Packages owner type for ${owner}; candidate tags will be retained"
              cleanup_status=blocked
              note_cleanup "owner type for ${owner} could not be resolved"
              ;;
          esac

          package_versions_file="$state_dir/package-versions.json"
          package_versions_flat="$state_dir/package-versions-flat.json"
          refresh_package_versions() {
            if [ -z "$package_versions_endpoint" ]; then
              return 1
            fi
            if ! gh api --paginate --slurp \
              "${package_versions_endpoint}?per_page=100" \
              >"$package_versions_file"; then
              return 1
            fi
            jq -e "add // []" "$package_versions_file" >"$package_versions_flat"
          }

          cleanup_package_tags() {
            local label="$1"
            shift
            local target_tag tag_record version_id non_allowed tags_json
            local allowed_json
            local target_tags=("$@")
            if [ -z "$package_versions_endpoint" ]; then
              cleanup_status=blocked
              note_cleanup "${label}: GitHub Packages API endpoint unavailable"
              return
            fi
            if ! refresh_package_versions; then
              echo "::warning::${label}: cannot enumerate GitHub Packages versions; no deletion attempted"
              cleanup_status=blocked
              note_cleanup "${label}: package version enumeration failed"
              return
            fi
            allowed_json="$(printf '%s\n' "${cleanup_allowed_tags[@]}" |
              jq -Rsc 'split("\n") | map(select(length > 0))')"
            for target_tag in "${target_tags[@]}"; do
              tag_record="$(jq -c --arg tag "$target_tag" \
                'map(select((.metadata.container.tags // []) | index($tag) != null)) | .[0] // empty' \
                "$package_versions_flat")"
              if [ -z "$tag_record" ]; then
                echo "::notice::${label}: ${target_tag} is absent"
                continue
              fi
              version_id="$(jq -r '.id // empty' <<<"$tag_record")"
              tags_json="$(jq -c '.metadata.container.tags // []' <<<"$tag_record")"
              non_allowed="$(jq -r --argjson allowed "$allowed_json" \
                '.metadata.container.tags // [] | map(. as $tag | select(($allowed | index($tag)) == null)) | .[]?' \
                <<<"$tag_record")"
              if [ -n "$non_allowed" ]; then
                echo "::warning::${label}: retaining ${target_tag}; package version ${version_id} also has non-target tags: ${non_allowed//$'\n'/, }"
                cleanup_status=blocked
                note_cleanup "${label}: ${target_tag} shares package version ${version_id} with non-target tags ${tags_json}"
                continue
              fi
              if [ -n "${deleted_version_ids[$version_id]:-}" ]; then
                continue
              fi
              if gh api --method DELETE \
                "${package_versions_endpoint}/${version_id}" >/dev/null; then
                deleted_version_ids[$version_id]=1
                echo "::notice::${label}: deleted package version ${version_id} containing only target tags ${tags_json}"
              else
                echo "::warning::${label}: failed to delete package version ${version_id}; target ${target_tag} retained"
                cleanup_status=blocked
                note_cleanup "${label}: deletion failed for package version ${version_id}"
              fi
            done
            if ! refresh_package_versions; then
              echo "::warning::${label}: cannot re-enumerate GitHub Packages versions for deletion verification"
              cleanup_status=blocked
              note_cleanup "${label}: post-delete enumeration failed"
              return
            fi
            for target_tag in "${target_tags[@]}"; do
              if jq -e --arg tag "$target_tag" \
                'any(.[]; (.metadata.container.tags // []) | index($tag) != null)' \
                "$package_versions_flat" >/dev/null; then
                echo "::warning::${label}: ${target_tag} still exists after cleanup"
                cleanup_status=blocked
                note_cleanup "${label}: ${target_tag} remains after deletion verification"
              else
                echo "::notice::${label}: verified ${target_tag} absent"
              fi
            done
          }

          new_formal_tags=()
          if [ -f "$state_dir/promotion-started" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            snapshot="$state_dir/formal-tag-snapshot"
            if [ -r "$snapshot" ]; then
              while IFS=$'\t' read -r tag digest; do
                [ -n "$tag" ] || continue
                if [ "$digest" != "-" ]; then
                  docker buildx imagetools create \
                    --tag "${repository}:${tag}" \
                    "${repository}@${digest}" || \
                    echo "::warning::failed to restore ${repository}:${tag} at ${digest}"
                else
                  new_formal_tags+=("$tag")
                fi
              done <"$snapshot"
            else
              echo "::warning::formal tag snapshot is unavailable; no formal tag deletion will be attempted"
              cleanup_status=blocked
              note_cleanup "failed promotion: formal tag snapshot unavailable"
            fi
          fi

          cleanup_allowed_tags=("${candidate_tags[@]}" "${new_formal_tags[@]}")
          cleanup_package_tags "candidate cleanup" "${candidate_tags[@]}"
          if [ "${#new_formal_tags[@]}" -gt 0 ]; then
            cleanup_package_tags "failed-promotion cleanup" "${new_formal_tags[@]}"
          fi

          if [ -f "$state_dir/release-created" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            draft="$(gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null)"
            if [ "$draft" = true ]; then
              gh release delete "$VERSION" --yes || true
            else
              echo "::warning::formal release $VERSION is public; manual cleanup is required"
            fi
          fi
          if [ -f "$state_dir/tag-created" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            echo "::warning::manual cleanup required for refs/tags/$VERSION at $TARGET_SHA"
          fi
          {
            echo '### Release cleanup'
            echo "- candidate tags: ${candidate_tags[*]}"
            if [ "$cleanup_status" = success ]; then
              echo '- candidate cleanup status: success'
            else
              echo '- candidate cleanup status: blocked or incomplete'
            fi
            if [ "${#cleanup_summary[@]}" -gt 0 ]; then
              for note in "${cleanup_summary[@]}"; do
                echo "- $note"
              done
            fi
            if [ -f "$state_dir/release-complete" ]; then
              echo '- formal release marker: complete'
            else
              echo '- formal release marker: incomplete'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$cleanup_status" != success ]; then
            echo '::warning::formal publication may be complete, but release cleanup was not fully completed safely; see the job summary'
          fi
