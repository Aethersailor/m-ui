name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Install and build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build

      - name: Verify backend and real Mihomo
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          make smoke

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          version_number="${version#v}"
          commit="$(git rev-parse --short=12 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p release

          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            mkdir -p "${stage}/deploy" "${stage}/scripts"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build \
              -tags webembed -trimpath \
              -ldflags "-X github.com/Aethersailor/m-ui/internal/version.version=${version} -X github.com/Aethersailor/m-ui/internal/version.commit=${commit} -X github.com/Aethersailor/m-ui/internal/version.date=${build_date} -X github.com/Aethersailor/m-ui/internal/version.dirty=false" \
              -o "${stage}/m-ui" ./cmd/m-ui
            cp -R deploy/systemd deploy/sudoers "${stage}/deploy/"
            cp scripts/install.sh scripts/uninstall.sh scripts/smoke-test.sh \
              "${stage}/scripts/"
            cp LICENSE README.md "${stage}/"
            chmod 0755 "${stage}/m-ui" "${stage}/scripts/"*.sh
            tar --owner=0 --group=0 -C "${stage}" -czf \
              "release/m-ui_${version_number}_linux_${arch}.tar.gz" .
            rm -rf -- "${stage}"
          done

          cp scripts/install.sh release/install.sh
          (
            cd release
            sha256sum m-ui_*.tar.gz install.sh > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "m-ui ${GITHUB_REF_NAME}" \
            release/*
