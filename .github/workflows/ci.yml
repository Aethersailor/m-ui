name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Test backend
        run: go test ./...

      - name: Vet backend
        run: go vet ./...

      - name: Test backend with race detector
        run: go test -race ./...

      - name: Lint frontend
        run: npm --prefix web run lint

      - name: Type-check frontend
        run: npm --prefix web run typecheck

      - name: Test frontend
        run: npm --prefix web run test

      - name: Build frontend
        run: npm --prefix web run build

      - name: Run locked real Mihomo smoke test
        env:
          M_UI_GITHUB_TOKEN: ${{ github.token }}
        run: make smoke

      - name: Build release-shaped binary
        run: make build

      - name: Test install lifecycle in an isolated root
        run: bash scripts/manage-test.sh

      - name: Validate Linux configuration files
        run: |
          sudo visudo -cf deploy/sudoers/m-ui
          if ! getent passwd m-ui >/dev/null; then
            sudo useradd --system --user-group --no-create-home m-ui
          fi
          if ! getent passwd mihomo >/dev/null; then
            sudo useradd --system --user-group --no-create-home mihomo
          fi
          sudo install -m 0755 dist/m-ui /usr/bin/m-ui
          sudo install -d -m 0755 \
            /etc/mihomo /var/lib/mihomo /var/lib/m-ui/core/current
          sudo install -m 0755 /bin/true /var/lib/m-ui/core/current/mihomo
          systemd-analyze verify \
            deploy/systemd/m-ui.service \
            deploy/systemd/mihomo.service
          sudo rm -f /usr/bin/m-ui /var/lib/m-ui/core/current/mihomo

      - name: Verify Linux targets
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -tags webembed -trimpath \
              -o "dist/m-ui-linux-$arch" ./cmd/m-ui
          done

  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install verified policy tools
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" |
            sha256sum --check
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 \
            shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_x86_64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" |
            sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  hadolint" |
            sha256sum --check
          chmod 0755 hadolint
          sudo install -m 0755 hadolint /usr/local/bin/hadolint

      - name: Validate shell, workflows, and container definition
        run: |
          find scripts deploy -type f -name '*.sh' -print0 |
            xargs -0 shellcheck
          shellcheck deploy/openrc/m-ui deploy/openrc/mihomo
          actionlint
          hadolint Dockerfile

  golangci-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2
