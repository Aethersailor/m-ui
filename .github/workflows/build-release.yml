name: Smart Build & Release

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      mode:
        description: Test, build artifacts, mirror an existing release, or publish a release
        required: true
        default: test
        type: choice
        options:
          - test
          - build
          - mirror
          - release
      version_mode:
        description: Use the latest tag, an explicit version, or bump the latest tag
        required: true
        default: auto
        type: choice
        options:
          - auto
          - explicit
          - patch
          - minor
          - major
      version:
        description: vX.Y.Z or X.Y.Z when version mode is explicit
        required: false
        default: ''
        type: string
      target_ref:
        description: Remote branch, tag, or commit to test, build, or release
        required: true
        default: master
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease (never updates latest)
        required: true
        default: false
        type: boolean
      confirm:
        description: Type RELEASE only when mode is release
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: smart-build-${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'mirror') && 'registry' || github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'release' || inputs.mode == 'mirror')) }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.guard.outputs.mode }}
      version: ${{ steps.guard.outputs.version }}
      full_version: ${{ steps.guard.outputs.full_version }}
      package_version: ${{ steps.guard.outputs.package_version }}
      artifact_version: ${{ steps.guard.outputs.artifact_version }}
      created: ${{ steps.guard.outputs.created }}
      target_sha: ${{ steps.guard.outputs.target_sha }}
      target_ref: ${{ steps.guard.outputs.target_ref }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      latest_version: ${{ steps.guard.outputs.latest_version }}
      sha8: ${{ steps.guard.outputs.sha8 }}

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
          fetch-depth: 0

      - name: Resolve version and enforce remote target identity
        id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
          VERSION_INPUT: ${{ inputs.version }}
          VERSION_MODE: ${{ inputs.version_mode }}
          TARGET_REF_INPUT: ${{ inputs.target_ref }}
          PRERELEASE: ${{ inputs.prerelease }}
          CONFIRM: ${{ inputs.confirm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MODE="${MODE_INPUT:-test}"
          TARGET_REF="${TARGET_REF_INPUT:-$GITHUB_SHA}"
          VERSION_MODE="${VERSION_MODE:-auto}"
          PRERELEASE="${PRERELEASE:-false}"
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            MODE="test"
            TARGET_REF="$GITHUB_SHA"
            VERSION_MODE="auto"
            VERSION_INPUT=
            PRERELEASE="false"
          fi
          case "$MODE" in
            test|build|mirror|release) ;;
            *) echo "unsupported workflow mode: $MODE" >&2; exit 1 ;;
          esac
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9._/-]+$ ]]
          git fetch --force --tags origin
          TARGET_SHA="$(git rev-parse HEAD)"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$TARGET_REF" = master ]; then
            git fetch --no-tags --prune origin master
            test "$(git rev-parse origin/master)" = "$TARGET_SHA"
          fi
          case "$VERSION_MODE" in
            auto|explicit|patch|minor|major) ;;
            *) echo "unsupported version mode" >&2; exit 1 ;;
          esac
          normalize_version() {
            local candidate="$1"
            candidate="${candidate#v}"
            [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            printf 'v%s\n' "$candidate"
          }
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' |
            sort -V | tail -n 1)"
          [ -n "$latest" ] || latest="v0.0.0"
          if [ "$VERSION_MODE" = explicit ]; then
            test -n "$VERSION_INPUT"
            VERSION="$(normalize_version "$VERSION_INPUT")"
          elif [ "$VERSION_MODE" = auto ] && [ "$MODE" != release ]; then
            VERSION="$latest"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            major=$((10#$major))
            minor=$((10#$minor))
            patch=$((10#$patch))
            bump="$VERSION_MODE"
            [ "$bump" != auto ] || bump="patch"
            case "$bump" in
              patch) patch=$((patch + 1)) ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              major) major=$((major + 1)); minor=0; patch=0 ;;
            esac
            VERSION="v${major}.${minor}.${patch}"
          fi
          SHA8="${TARGET_SHA:0:8}"
          FULL_VERSION="${VERSION}.g${SHA8}"
          PACKAGE_VERSION="${VERSION#v}.g${SHA8}"
          CREATED="$(git show -s --format=%cI "$TARGET_SHA")"
          if [ "$MODE" = mirror ]; then
            test "$EVENT_NAME" = workflow_dispatch
            test "$TARGET_REF" = "$VERSION"
            test "$(git rev-parse "${VERSION}^{commit}")" = "$TARGET_SHA"
            release_json="$(gh release view "$VERSION" \
              --json isDraft,isPrerelease,tagName)"
            test "$(jq -r .tagName <<<"$release_json")" = "$VERSION"
            test "$(jq -r .isDraft <<<"$release_json")" = false
            test "$(jq -r .isPrerelease <<<"$release_json")" = "$PRERELEASE"
          fi
          if [ "$MODE" = release ]; then
            test "$CONFIRM" = RELEASE
            if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
              echo "release tag already exists" >&2
              exit 1
            fi
            if gh release view "$VERSION" >/dev/null 2>&1; then
              echo "GitHub Release already exists" >&2
              exit 1
            fi
          fi
          {
            printf 'mode=%s\n' "$MODE"
            printf 'version=%s\n' "$VERSION"
            printf 'full_version=%s\n' "$FULL_VERSION"
            printf 'package_version=%s\n' "$PACKAGE_VERSION"
            printf 'artifact_version=%s\n' "${VERSION#v}"
            printf 'created=%s\n' "$CREATED"
            printf 'target_sha=%s\n' "$TARGET_SHA"
            printf 'target_ref=%s\n' "$TARGET_REF"
            printf 'prerelease=%s\n' "$PRERELEASE"
            printf 'latest_version=%s\n' "$latest"
            printf 'sha8=%s\n' "$SHA8"
          } >>"$GITHUB_OUTPUT"
          {
            echo '### Build identity'
            echo "- mode: $MODE"
            echo "- release tag: $VERSION"
            echo "- complete version: $FULL_VERSION"
            echo "- source: $TARGET_SHA"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Lock official Mihomo release identity
        if: steps.guard.outputs.mode == 'build' || steps.guard.outputs.mode == 'release'
        env:
          M_UI_GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-mihomo.sh --output packaging/bootstrap

      - name: Upload locked bootstrap identity
        if: steps.guard.outputs.mode == 'build' || steps.guard.outputs.mode == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-identity-${{ steps.guard.outputs.sha8 }}
          path: packaging/bootstrap/identity.json
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: validate
    if: needs.validate.outputs.mode != 'mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Verify backend and frontend
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run test
          npm --prefix web run build
          npm --prefix web audit --audit-level=high

      - name: Build and verify the complete dynamic version
        env:
          VERSION: ${{ needs.validate.outputs.full_version }}
          COMMIT: ${{ needs.validate.outputs.sha8 }}
          BUILD_DATE: ${{ needs.validate.outputs.created }}
          DIRTY: false
        run: |
          make build
          build_output="$(dist/m-ui version)"
          grep -F "m-ui ${VERSION}" <<<"$build_output"
          grep -F "commit=${COMMIT}" <<<"$build_output"
          grep -F "date=${BUILD_DATE}" <<<"$build_output"

      - name: Download the locked Mihomo identity for artifact builds
        if: needs.validate.outputs.mode == 'build' || needs.validate.outputs.mode == 'release'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-identity-${{ needs.validate.outputs.sha8 }}
          path: packaging/bootstrap

      - name: Prepare the exact locked Mihomo used by the image
        if: needs.validate.outputs.mode == 'build' || needs.validate.outputs.mode == 'release'
        run: bash scripts/resolve-mihomo.sh --output packaging/bootstrap --architecture amd64

      - name: Run locked real Mihomo smoke test
        env:
          M_UI_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -x packaging/bootstrap/linux_amd64/mihomo ]; then
            M_UI_TEST_MIHOMO_BINARY="$PWD/packaging/bootstrap/linux_amd64/mihomo" \
              make smoke
          else
            make smoke
          fi

      - name: Test install lifecycle in an isolated root
        run: bash scripts/manage-test.sh

      - name: Validate Linux configuration files
        run: |
          sudo visudo -cf deploy/sudoers/m-ui
          if ! getent passwd m-ui >/dev/null; then
            sudo useradd --system --user-group --no-create-home m-ui
          fi
          if ! getent passwd mihomo >/dev/null; then
            sudo useradd --system --user-group --no-create-home mihomo
          fi
          sudo install -m 0755 dist/m-ui /usr/bin/m-ui
          sudo install -d -m 0755 \
            /etc/mihomo /var/lib/mihomo /var/lib/m-ui/core/current
          sudo install -m 0755 /bin/true /var/lib/m-ui/core/current/mihomo
          systemd-analyze verify \
            deploy/systemd/m-ui.service \
            deploy/systemd/mihomo.service
          sudo rm -f /usr/bin/m-ui /var/lib/m-ui/core/current/mihomo

      - name: Verify Linux targets compile
        env:
          VERSION: ${{ needs.validate.outputs.full_version }}
          COMMIT: ${{ needs.validate.outputs.sha8 }}
          BUILD_DATE: ${{ needs.validate.outputs.created }}
        run: |
          ldflags="-X github.com/Aethersailor/m-ui/internal/version.version=${VERSION} \
            -X github.com/Aethersailor/m-ui/internal/version.commit=${COMMIT} \
            -X github.com/Aethersailor/m-ui/internal/version.date=${BUILD_DATE} \
            -X github.com/Aethersailor/m-ui/internal/version.dirty=false"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -tags webembed -trimpath -ldflags "$ldflags" \
              -o "dist/m-ui-linux-$arch" ./cmd/m-ui
          done

  policy:
    needs: validate
    if: needs.validate.outputs.mode != 'mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Install verified policy tools
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" |
            sha256sum --check
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 \
            shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" |
            sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" |
            sha256sum --check
          chmod 0755 hadolint
          sudo install -m 0755 hadolint /usr/local/bin/hadolint

      - name: Validate shell, workflow, release config, and container definition
        run: |
          find scripts deploy -type f -name '*.sh' -print0 |
            xargs -0 shellcheck
          sh -n deploy/openrc/m-ui deploy/openrc/mihomo
          actionlint
          hadolint Dockerfile

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          M_UI_BUILD_VERSION: v0.0.0.g00000000
          M_UI_BUILD_COMMIT: 00000000
          M_UI_BUILD_DATE: 1970-01-01T00:00:00Z
          M_UI_PACKAGE_VERSION: 0.0.0.g00000000
          M_UI_ARTIFACT_VERSION: 0.0.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: check

  golangci-lint:
    needs: validate
    if: needs.validate.outputs.mode != 'mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  bootstrap:
    if: needs.validate.outputs.mode == 'build' || needs.validate.outputs.mode == 'release'
    needs:
      - validate
      - verify
      - policy
      - golangci-lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Download locked bootstrap identity
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-identity-${{ needs.validate.outputs.sha8 }}
          path: packaging/bootstrap

      - name: Verify and run the locked native Mihomo bootstrap
        run: |
          bash scripts/resolve-mihomo.sh \
            --output packaging/bootstrap \
            --architecture "${{ matrix.arch }}"
          packaging/bootstrap/linux_${{ matrix.arch }}/mihomo -v
          packaging/bootstrap/linux_${{ matrix.arch }}/mihomo \
            -t -f internal/publisher/testdata/vless_reality.golden.yaml

      - name: Upload verified native bootstrap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bootstrap-${{ needs.validate.outputs.sha8 }}-${{ matrix.arch }}
          path: packaging/bootstrap
          if-no-files-found: error
          retention-days: 7

  assets:
    needs:
      - validate
      - bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Download verified bootstraps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-bootstrap-${{ needs.validate.outputs.sha8 }}-*
          path: packaging/bootstrap
          merge-multiple: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend assets
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Install verified Syft
        run: |
          syft_dir="$RUNNER_TEMP/m-ui-syft"
          mkdir -p "$syft_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$syft_dir/syft.tar.gz" \
            https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_amd64.tar.gz
          echo "bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788  $syft_dir/syft.tar.gz" |
            sha256sum --check
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          sudo install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Build release archives, packages, checksums, and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          M_UI_BUILD_VERSION: ${{ needs.validate.outputs.full_version }}
          M_UI_BUILD_COMMIT: ${{ needs.validate.outputs.sha8 }}
          M_UI_BUILD_DATE: ${{ needs.validate.outputs.created }}
          M_UI_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
          M_UI_ARTIFACT_VERSION: ${{ needs.validate.outputs.artifact_version }}
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=publish

      - name: Add lifecycle scripts and latest Compose definition
        run: |
          cp scripts/manage.sh scripts/install.sh scripts/install-docker.sh \
            scripts/uninstall.sh dist/
          cp deploy/docker/compose.yml dist/compose.yml
          grep -q '^    image: ghcr.io/aethersailor/m-ui:latest$' \
            dist/compose.yml
          if grep -Eq '\$\{|M_UI_|data-init' dist/compose.yml; then
            echo "release Compose contains a variable or legacy initializer" >&2
            exit 1
          fi
          cp packaging/bootstrap/identity.json \
            dist/MIHOMO_BOOTSTRAP_IDENTITY.json
          (
            cd dist
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.apk' \
                 -o -name '*.sbom.spdx.json' -o -name 'manage.sh' \
                 -o -name 'install.sh' -o -name 'install-docker.sh' \
                 -o -name 'uninstall.sh' \
                 -o -name 'compose.yml' \
                 -o -name 'MIHOMO_BOOTSTRAP_IDENTITY.json' \) \
              -printf '%f\t%s\n' | sort >ARTIFACT_SIZES.txt
            find . -maxdepth 1 -type f \
              \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.apk' \
                 -o -name '*.sbom.spdx.json' -o -name 'manage.sh' \
                 -o -name 'install.sh' -o -name 'install-docker.sh' \
                 -o -name 'uninstall.sh' \
                 -o -name 'compose.yml' \
                 -o -name 'MIHOMO_BOOTSTRAP_IDENTITY.json' \
                 -o -name 'ARTIFACT_SIZES.txt' \) \
              -printf '%f\n' | sort |
              xargs sha256sum >SHA256SUMS
          )

      - name: Verify release artifact matrix
        env:
          EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 2
          test -s dist/SHA256SUMS
          test -s dist/ARTIFACT_SIZES.txt
          test -s dist/compose.yml
          test -s dist/install-docker.sh
          test "$(find dist -maxdepth 1 -name '*.sbom.spdx.json' | wc -l)" -ge 6
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          for arch in amd64 arm64; do
            deb_version="$(dpkg-deb -f \
              "dist/m-ui_${{ needs.validate.outputs.artifact_version }}_linux_${arch}.deb" \
              Version)"
            apk_version="$(tar -xOf \
              "dist/m-ui_${{ needs.validate.outputs.artifact_version }}_linux_${arch}.apk" \
              .PKGINFO 2>/dev/null | sed -n 's/^pkgver = //p')"
            test "$deb_version" = "$EXPECTED_PACKAGE_VERSION"
            test "$apk_version" = "$EXPECTED_PACKAGE_VERSION"
          done
          for artifact in dist/*.tar.gz dist/*.deb dist/*.apk; do
            test "$(stat -c '%s' "$artifact")" -le 33554432
          done
          {
            echo '### Native release artifact sizes'
            echo '```text'
            cat dist/ARTIFACT_SIZES.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m-ui-${{ needs.validate.outputs.full_version }}-native
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.apk
            dist/SHA256SUMS
            dist/ARTIFACT_SIZES.txt
            dist/*.sbom.spdx.json
            dist/manage.sh
            dist/install.sh
            dist/install-docker.sh
            dist/uninstall.sh
            dist/compose.yml
            dist/MIHOMO_BOOTSTRAP_IDENTITY.json
          if-no-files-found: error
          retention-days: 7

  image:
    needs:
      - validate
      - bootstrap
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            syft_sha: bf7b29ff57f06da30918266a0e1c2885a8f99784798d1bdb1628886aa015d788
          - arch: arm64
            runner: ubuntu-24.04-arm
            syft_sha: 887c57cbcc2d0e8c5c110a4571a3fc7150058b24d74f993ee4663516e5c8ce86
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35

    steps:
      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}

      - name: Download verified native bootstrap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bootstrap-${{ needs.validate.outputs.sha8 }}-${{ matrix.arch }}
          path: packaging/bootstrap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install verified native Syft
        run: |
          syft_dir="$RUNNER_TEMP/m-ui-syft"
          mkdir -p "$syft_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$syft_dir/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v1.50.0/syft_1.50.0_linux_${{ matrix.arch }}.tar.gz"
          echo "${{ matrix.syft_sha }}  $syft_dir/syft.tar.gz" | sha256sum --check
          tar -xzf "$syft_dir/syft.tar.gz" -C "$syft_dir" syft
          sudo install -m 0755 "$syft_dir/syft" /usr/local/bin/syft

      - name: Build and smoke-test native image
        env:
          IMAGE: m-ui:${{ needs.validate.outputs.sha8 }}-${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.full_version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.sha8 }}
          EXPECTED_REVISION: ${{ needs.validate.outputs.target_sha }}
        run: |
          sudo test -d /opt
          sudo test ! -L /opt
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --build-arg VERSION="$EXPECTED_VERSION" \
            --build-arg COMMIT="$EXPECTED_COMMIT" \
            --build-arg REVISION=${{ needs.validate.outputs.target_sha }} \
            --build-arg CREATED=${{ needs.validate.outputs.created }} \
            --cache-from type=gha,scope=m-ui-image-${{ matrix.arch }} \
            --cache-to type=gha,mode=max,scope=m-ui-image-${{ matrix.arch }} \
            --load \
            --tag "$IMAGE" .
          M_UI_EXPECTED_VERSION="$EXPECTED_VERSION" \
            M_UI_EXPECTED_REVISION="$EXPECTED_REVISION" \
            bash scripts/docker-smoke.sh "$IMAGE"
          bash scripts/docker-compose-smoke.sh "$IMAGE"
          docker run --rm --entrypoint /usr/bin/m-ui "$IMAGE" version |
            grep -F "m-ui ${EXPECTED_VERSION} (commit=${EXPECTED_COMMIT} "
          syft "$IMAGE" \
            -o spdx-json=m-ui-image-${{ matrix.arch }}.sbom.spdx.json
          docker save "$IMAGE" | gzip -9 >m-ui-image-${{ matrix.arch }}.tar.gz
          gzip --test m-ui-image-${{ matrix.arch }}.tar.gz
          test "$(stat -c '%s' m-ui-image-${{ matrix.arch }}.tar.gz)" -le 67108864
          sha256sum m-ui-image-${{ matrix.arch }}.tar.gz \
            m-ui-image-${{ matrix.arch }}.sbom.spdx.json \
            >docker-SHA256SUMS
          {
            echo "### linux/${{ matrix.arch }} image artifact size"
            stat -c '%n %s bytes' m-ui-image-${{ matrix.arch }}.tar.gz
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload native image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m-ui-${{ needs.validate.outputs.full_version }}-image-${{ matrix.arch }}
          path: |
            m-ui-image-${{ matrix.arch }}.tar.gz
            docker-SHA256SUMS
            m-ui-image-${{ matrix.arch }}.sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  package-test:
    needs:
      - validate
      - assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            format: deb
          - image: ubuntu:24.04
            format: deb
          - image: alpine:3.20
            format: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m-ui-${{ needs.validate.outputs.full_version }}-native
          path: release

      - name: Test native package lifecycle
        env:
          FORMAT: ${{ matrix.format }}
          IMAGE: ${{ matrix.image }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.full_version }}
        run: |
          docker run --rm \
            -e FORMAT -e EXPECTED_VERSION \
            -v "$PWD/release:/release:ro" \
            "$IMAGE" sh -euxc '
              package="$(find /release -maxdepth 1 \
                -name "*linux_amd64.${FORMAT}" -print -quit)"
              test -n "$package"
              if [ "$FORMAT" = deb ]; then
                apt-get update
                apt-get install -y "$package"
                run_core="runuser -u m-ui --"
              else
                apk add --allow-untrusted "$package"
                run_core="su-exec m-ui"
              fi
              test -x /usr/bin/m-ui
              test -x /var/lib/m-ui/core/current/mihomo
              m-ui version | grep -F "m-ui ${EXPECTED_VERSION} "
              m-ui status
              $run_core /usr/bin/m-ui core status \
                --json --config /etc/m-ui/config.toml
              printf "%s\n" preserve > /var/lib/m-ui/package-test-marker
              m-ui uninstall
              test ! -e /usr/bin/m-ui
              test -f /var/lib/m-ui/package-test-marker
              if [ "$FORMAT" = deb ]; then
                apt-get install -y "$package"
              else
                apk add --allow-untrusted "$package"
              fi
              m-ui status
              test -f /var/lib/m-ui/package-test-marker
            '

  mirror:
    if: needs.validate.outputs.mode == 'mirror'
    needs:
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install verified registry client
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output regctl \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo 'c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  regctl' |
            sha256sum --check
          chmod 0755 regctl
          sudo install -m 0755 regctl /usr/local/bin/regctl

      - name: Mirror the verified GHCR release to Docker Hub
        id: mirror-images
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.full_version }}
          LATEST_VERSION: ${{ needs.validate.outputs.latest_version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/m-ui-mirror-state"
          rm -rf "$state_dir"
          mkdir -p "$state_dir"

          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test "${DOCKERHUB_USERNAME,,}" = "$namespace"
          registry_path="${namespace}/m-ui"
          source_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          target_repository="docker.io/${registry_path}"
          printf '%s\n' "$target_repository" >"$state_dir/repository"

          hub_auth_payload="$(jq -nc \
            --arg identifier "$DOCKERHUB_USERNAME" \
            --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}')"
          hub_token="$(curl --fail --silent --show-error \
            --request POST --header 'Content-Type: application/json' \
            --data "$hub_auth_payload" \
            'https://hub.docker.com/v2/auth/token' |
            jq -er .access_token)"
          repository_json="$(mktemp)"
          repository_status="$(curl --silent --show-error \
            --output "$repository_json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${hub_token}" \
            "https://hub.docker.com/v2/namespaces/${namespace}/repositories/m-ui")"
          case "$repository_status" in
            200)
              jq -e '.is_private == false' "$repository_json" >/dev/null
              ;;
            404)
              create_payload="$(jq -nc --arg namespace "$namespace" '{
                name: "m-ui",
                namespace: $namespace,
                description: "Lightweight Web UI for one Mihomo instance",
                registry: "docker.io",
                is_private: false
              }')"
              create_status="$(curl --silent --show-error \
                --output "$repository_json" --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/json' \
                --header "Authorization: Bearer ${hub_token}" \
                --data "$create_payload" \
                "https://hub.docker.com/v2/namespaces/${namespace}/repositories")"
              test "$create_status" = 201
              jq -e '.name == "m-ui" and .is_private == false' \
                "$repository_json" >/dev/null
              ;;
            *)
              echo "unexpected Docker Hub repository status: ${repository_status}" >&2
              exit 1
              ;;
          esac

          auth_json="$(curl --fail --silent --show-error \
            --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            --get 'https://auth.docker.io/token' \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:${registry_path}:pull,push,delete")"
          registry_token="$(jq -er '.token // .access_token' <<<"$auth_json")"
          jwt_payload="${registry_token#*.}"
          jwt_payload="${jwt_payload%%.*}"
          jwt_payload="$(tr '_-' '/+' <<<"$jwt_payload")"
          case $((${#jwt_payload} % 4)) in
            2) jwt_payload+='==' ;;
            3) jwt_payload+='=' ;;
          esac
          token_claims="$(base64 --decode <<<"$jwt_payload")"
          jq -e --arg repository "$registry_path" '
            any(.access[]?;
              .type == "repository" and .name == $repository and
              (.actions | index("pull")) != null and
              (.actions | index("push")) != null and
              (.actions | index("delete")) != null)
          ' <<<"$token_claims" >/dev/null
          echo "$DOCKERHUB_TOKEN" |
            docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          source_digest="$(docker buildx imagetools inspect \
            "${source_repository}:${VERSION}" \
            --format '{{ .Manifest.Digest }}')"
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_index="$(docker buildx imagetools inspect \
            "${source_repository}@${source_digest}" --raw)"
          jq -e '
            (.manifests | length) == 2 and
            ([.manifests[] | [.platform.os, .platform.architecture]] | sort) ==
              [["linux", "amd64"], ["linux", "arm64"]]
          ' <<<"$source_index" >/dev/null
          while IFS=$'\t' read -r architecture platform_digest; do
            labels="$(docker buildx imagetools inspect \
              "${source_repository}@${platform_digest}" \
              --format '{{json .Image.Config.Labels}}')"
            jq -e --arg revision "$TARGET_SHA" --arg version "$EXPECTED_VERSION" '
              .["org.opencontainers.image.revision"] == $revision and
              .["org.opencontainers.image.version"] == $version
            ' <<<"$labels" >/dev/null
            echo "verified source identity for linux/${architecture}"
          done < <(jq -r '.manifests[] |
            [.platform.architecture, .digest] | @tsv' <<<"$source_index")

          tag_digest() {
            local tag="$1"
            local status digest
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://registry-1.docker.io/v2/${registry_path}/manifests/${tag}")"
            case "$status" in
              200)
                digest="$(docker buildx imagetools inspect \
                  "${target_repository}:${tag}" \
                  --format '{{ .Manifest.Digest }}')"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                printf '%s\n' "$digest"
                ;;
              404) printf '%s\n' - ;;
              *) echo "unexpected Docker Hub status ${status} for ${tag}" >&2; return 1 ;;
            esac
          }

          version_before="$(tag_digest "$VERSION")"
          latest_before=-
          updates_latest=false
          if [ "$PRERELEASE" != true ] && [ "$VERSION" = "$LATEST_VERSION" ]; then
            updates_latest=true
            latest_before="$(tag_digest latest)"
          fi
          printf '%s\t%s\n' "$VERSION" "$version_before" \
            >"$state_dir/tag-snapshot"
          if [ "$updates_latest" = true ]; then
            printf '%s\t%s\n' latest "$latest_before" \
              >>"$state_dir/tag-snapshot"
          fi

          if [ "$version_before" != - ]; then
            test "$version_before" = "$source_digest"
            if [ "$updates_latest" = false ] ||
               [ "$latest_before" = "$source_digest" ]; then
              echo "Docker Hub already contains the verified release."
              mutation_needed=false
            else
              mutation_needed=true
            fi
          else
            mutation_needed=true
          fi

          if [ "$mutation_needed" = true ]; then
            touch "$state_dir/mutation-started"
            if [ "$version_before" = - ]; then
              regctl image copy "${source_repository}@${source_digest}" \
                "${target_repository}:${VERSION}"
            fi
            if [ "$updates_latest" = true ]; then
              regctl image copy "${target_repository}:${VERSION}" \
                "${target_repository}:latest"
            fi
          fi

          verify_tags=("$VERSION")
          if [ "$updates_latest" = true ]; then
            verify_tags+=(latest)
          fi
          for tag in "${verify_tags[@]}"; do
            test "$(tag_digest "$tag")" = "$source_digest"
            target_index="$(docker buildx imagetools inspect \
              "${target_repository}:${tag}" --raw)"
            jq -e '
              (.manifests | length) == 2 and
              ([.manifests[] | [.platform.os, .platform.architecture]] | sort) ==
                [["linux", "amd64"], ["linux", "arm64"]]
            ' <<<"$target_index" >/dev/null
          done
          printf 'subject_name=%s\n' "$target_repository" >>"$GITHUB_OUTPUT"
          printf 'subject_digest=%s\n' "$source_digest" >>"$GITHUB_OUTPUT"
          {
            echo '### Docker Hub mirror'
            echo "- source: ${source_repository}@${source_digest}"
            echo "- target: ${target_repository}:${VERSION}"
            if [ "$updates_latest" = true ]; then
              echo "- stable tag: ${target_repository}:latest"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remove legacy GHCR tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          archive="$RUNNER_TEMP/m-ui-ghcr-retained"
          snapshot="$RUNNER_TEMP/m-ui-ghcr-retained.tsv"
          versions="$RUNNER_TEMP/m-ui-ghcr-versions.json"
          rm -rf "$archive"
          : >"$snapshot"
          mapfile -t retained_tags < <(regctl tag ls "$repository" \
            --format '{{range .Tags}}{{println .}}{{end}}' |
            awk '$0 == "latest" || $0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/')
          ((${#retained_tags[@]} > 0))
          printf '%s\n' "${retained_tags[@]}" | grep -qx latest
          for tag in "${retained_tags[@]}"; do
            digest="$(docker buildx imagetools inspect \
              "$repository:$tag" --format '{{ .Manifest.Digest }}')"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            regctl image copy --force-recursive "$repository:$tag" \
              "ocidir://${archive}:${tag}"
            printf '%s\t%s\n' "$tag" "$digest" >>"$snapshot"
          done

          owner_type="$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq .type)"
          package_name="${GITHUB_REPOSITORY#*/}"
          case "$owner_type" in
            Organization)
              package_api="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}"
              ;;
            User)
              package_api="users/${GITHUB_REPOSITORY_OWNER}/packages/container/${package_name}"
              ;;
            *)
              echo "unsupported GitHub owner type: ${owner_type}" >&2
              exit 1
              ;;
          esac
          gh api --paginate --slurp "${package_api}/versions?per_page=100" |
            jq 'flatten' >"$versions"

          cleanup_status=success
          removed_versions=0
          while IFS=$'\t' read -r id digest tags; do
            [ -n "$id" ] || continue
            echo "removing legacy GHCR package version ${digest} (${tags})"
            if gh api --method DELETE "${package_api}/versions/${id}" --silent; then
              removed_versions=$((removed_versions + 1))
            else
              cleanup_status=blocked
            fi
          done < <(jq -r '
            .[] |
            .metadata.container.tags as $tags |
            select(any($tags[]?;
              . != "latest" and
              (test("^v[0-9]+\\.[0-9]+\\.[0-9]+$") | not))) |
            [.id, .name, ($tags | join(","))] | @tsv
          ' "$versions")

          while IFS=$'\t' read -r tag digest; do
            if ! regctl image copy --force-recursive \
              "ocidir://${archive}:${tag}" "$repository:$tag"; then
              cleanup_status=blocked
            fi
          done <"$snapshot"

          reachable="$RUNNER_TEMP/m-ui-ghcr-reachable.txt"
          cut -f2 "$snapshot" >"$reachable"
          while IFS=$'\t' read -r tag digest; do
            docker buildx imagetools inspect "$repository:$tag" --raw |
              jq -r '.manifests[]?.digest' >>"$reachable"
          done <"$snapshot"
          sort -u -o "$reachable" "$reachable"

          gh api --paginate --slurp "${package_api}/versions?per_page=100" |
            jq 'flatten' >"$versions"
          while IFS=$'\t' read -r id digest; do
            [ -n "$id" ] || continue
            echo "removing unreachable GHCR package version ${digest}"
            if gh api --method DELETE "${package_api}/versions/${id}" --silent; then
              removed_versions=$((removed_versions + 1))
            else
              cleanup_status=blocked
            fi
          done < <(jq --rawfile reachable "$reachable" -r '
            ($reachable | split("\n") | map(select(length > 0))) as $keep |
            .[] as $version |
            select(($version.metadata.container.tags | length) == 0) |
            select(($keep | index($version.name)) == null) |
            [$version.id, $version.name] | @tsv
          ' "$versions")

          while IFS=$'\t' read -r tag digest; do
            current="$(docker buildx imagetools inspect \
              "$repository:$tag" --format '{{ .Manifest.Digest }}' \
              2>/dev/null || printf %s -)"
            if [ "$current" != "$digest" ]; then
              cleanup_status=blocked
              echo "::error::GHCR tag ${tag} was not restored to ${digest}"
            fi
          done <"$snapshot"
          unexpected="$(regctl tag ls "$repository" \
            --format '{{range .Tags}}{{println .}}{{end}}' |
            awk '$0 != "latest" && $0 !~ /^v[0-9]+\.[0-9]+\.[0-9]+$/')"
          if [ -n "$unexpected" ]; then
            cleanup_status=blocked
            echo "::error::Unexpected GHCR tags remain:"
            printf '%s\n' "$unexpected"
          fi
          gh api --paginate --slurp "${package_api}/versions?per_page=100" |
            jq 'flatten' >"$versions"
          actual_digests="$(mktemp)"
          jq -r '.[].name' "$versions" | sort -u >"$actual_digests"
          missing="$(comm -23 "$reachable" "$actual_digests")"
          unreachable="$(comm -13 "$reachable" "$actual_digests")"
          if [ -n "$missing" ] || [ -n "$unreachable" ]; then
            cleanup_status=blocked
            [ -z "$missing" ] || {
              echo '::error::Required GHCR package versions are missing:'
              printf '%s\n' "$missing"
            }
            [ -z "$unreachable" ] || {
              echo '::error::Unreachable GHCR package versions remain:'
              printf '%s\n' "$unreachable"
            }
          fi
          {
            echo '### GHCR tag policy'
            echo "- removed legacy package versions: ${removed_versions}"
            echo '- retained tags: latest and exact vX.Y.Z releases'
            echo "- cleanup status: ${cleanup_status}"
          } >>"$GITHUB_STEP_SUMMARY"
          test "$cleanup_status" = success

      - name: Attest the Docker Hub mirror
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.mirror-images.outputs.subject_name }}
          subject-digest: ${{ steps.mirror-images.outputs.subject_digest }}

      - name: Complete the verified Docker Hub mirror
        run: touch "$RUNNER_TEMP/m-ui-mirror-state/mirror-complete"

      - name: Roll back an incomplete Docker Hub mirror
        if: ${{ always() }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set +e
          state_dir="$RUNNER_TEMP/m-ui-mirror-state"
          if [ -f "$state_dir/mirror-complete" ] ||
             [ ! -f "$state_dir/mutation-started" ]; then
            exit 0
          fi

          cleanup_status=success
          repository="$(cat "$state_dir/repository")"
          if ! echo "$DOCKERHUB_TOKEN" | docker login docker.io \
            -u "$DOCKERHUB_USERNAME" --password-stdin; then
            cleanup_status=blocked
          fi
          declare -A prior=()
          while IFS=$'\t' read -r tag digest; do
            prior[$tag]="$digest"
            if [ "$digest" = - ]; then
              if ! regctl tag delete --ignore-missing \
                "${repository}:${tag}"; then
                cleanup_status=blocked
              fi
            elif ! docker buildx imagetools create \
              --tag "${repository}:${tag}" "${repository}@${digest}"; then
              cleanup_status=blocked
            fi
          done <"$state_dir/tag-snapshot"

          for tag in "${!prior[@]}"; do
            current="$(docker buildx imagetools inspect \
              "${repository}:${tag}" --format '{{ .Manifest.Digest }}' \
              2>/dev/null || printf %s -)"
            if [ "$current" != "${prior[$tag]}" ]; then
              cleanup_status=blocked
              echo "::warning::Docker Hub tag ${tag} was not restored"
            fi
          done
          {
            echo '### Docker Hub mirror cleanup'
            echo "- rollback cleanup status: ${cleanup_status}"
          } >>"$GITHUB_STEP_SUMMARY"
          test "$cleanup_status" = success

  publish:
    if: needs.validate.outputs.mode == 'release'
    needs:
      - validate
      - assets
      - image
      - package-test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the verified target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0

      - name: Download native release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: m-ui-${{ needs.validate.outputs.full_version }}-native
          path: release

      - name: Download image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m-ui-${{ needs.validate.outputs.full_version }}-image-*
          path: images
          merge-multiple: true

      - name: Download verified native bootstraps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-bootstrap-${{ needs.validate.outputs.sha8 }}-*
          path: packaging/bootstrap
          merge-multiple: true

      - name: Set up multi-architecture emulation
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install verified registry client
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output regctl \
            https://github.com/regclient/regclient/releases/download/v0.11.5/regctl-linux-amd64
          echo 'c93aa7638749f5aaac1a8e01787321889c78f0101809bb2880343478d0ba0467  regctl' |
            sha256sum --check
          chmod 0755 regctl
          sudo install -m 0755 regctl /usr/local/bin/regctl

      - name: Authenticate and snapshot protected registry tags
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/m-ui-release-state"
          rm -rf "$state_dir"
          mkdir -p "$state_dir"
          printf 'version=%s\ntarget_sha=%s\n' \
            "$VERSION" "$TARGET_SHA" >"$state_dir/metadata"
          (
            cd release
            sha256sum --check SHA256SUMS
          )

          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          owner_type="$(gh api "/users/${owner}" -q .type)"
          case "$owner_type" in
            User)
              package_versions_endpoint="/users/${owner}/packages/container/${package}/versions"
              ;;
            Organization)
              package_versions_endpoint="/orgs/${owner}/packages/container/${package}/versions"
              ;;
            *)
              echo "::error::cannot resolve GitHub Packages owner type for ${owner}"
              exit 1
              ;;
          esac

          pages="$state_dir/formal-tag-package-versions.json"
          flat="$state_dir/formal-tag-package-versions-flat.json"
          gh api --paginate --slurp \
            "${package_versions_endpoint}?per_page=100" >"$pages"
          jq -e 'if type != "array" or any(.[]; type != "array") then
               error("invalid GitHub Packages pagination response")
             else
               add // []
             end' "$pages" >"$flat"

          snapshot="$state_dir/formal-tag-snapshot"
          : >"$snapshot"
          snapshot_tag() {
            local tag="$1"
            local records count digest
            records="$(
              jq -c --arg tag "$tag" \
                'map(select((.metadata.container.tags // []) | index($tag) != null))' \
                "$flat"
            )"
            count="$(jq -r 'length' <<<"$records")"
            case "$count" in
              0)
                printf '%s\t-\n' "$tag" >>"$snapshot"
                ;;
              1)
                digest="$(jq -r '.[0].name // empty' <<<"$records")"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                printf '%s\t%s\n' "$tag" "$digest" >>"$snapshot"
                ;;
              *)
                echo "::error::formal tag ${tag} maps to ${count} package versions"
                exit 1
                ;;
            esac
          }

          snapshot_tag "$VERSION"
          if ! grep -qxF "$VERSION"$'\t-' "$snapshot"; then
            echo "::error::release image tag already exists: $VERSION"
            exit 1
          fi
          if [ "$PRERELEASE" != true ]; then
            snapshot_tag latest
          fi

          echo "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          namespace="${GITHUB_REPOSITORY_OWNER,,}"
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          test "${DOCKERHUB_USERNAME,,}" = "$namespace"
          registry_path="${namespace}/m-ui"
          dockerhub_repository="docker.io/${registry_path}"
          printf '%s\n' "$dockerhub_repository" \
            >"$state_dir/dockerhub-repository"
          printf 'DOCKERHUB_REPOSITORY=%s\n' "$dockerhub_repository" \
            >>"$GITHUB_ENV"

          hub_auth_payload="$(jq -nc \
            --arg identifier "$DOCKERHUB_USERNAME" \
            --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}')"
          hub_token="$(curl --fail --silent --show-error \
            --request POST --header 'Content-Type: application/json' \
            --data "$hub_auth_payload" \
            'https://hub.docker.com/v2/auth/token' |
            jq -er .access_token)"
          repository_json="$(mktemp)"
          repository_status="$(curl --silent --show-error \
            --output "$repository_json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${hub_token}" \
            "https://hub.docker.com/v2/namespaces/${namespace}/repositories/m-ui")"
          case "$repository_status" in
            200)
              jq -e '.is_private == false' "$repository_json" >/dev/null
              ;;
            404)
              create_payload="$(jq -nc --arg namespace "$namespace" '{
                name: "m-ui",
                namespace: $namespace,
                description: "Lightweight Web UI for one Mihomo instance",
                registry: "docker.io",
                is_private: false
              }')"
              create_status="$(curl --silent --show-error \
                --output "$repository_json" --write-out '%{http_code}' \
                --request POST --header 'Content-Type: application/json' \
                --header "Authorization: Bearer ${hub_token}" \
                --data "$create_payload" \
                "https://hub.docker.com/v2/namespaces/${namespace}/repositories")"
              test "$create_status" = 201
              jq -e '.name == "m-ui" and .is_private == false' \
                "$repository_json" >/dev/null
              ;;
            *)
              echo "unexpected Docker Hub repository status: ${repository_status}" >&2
              exit 1
              ;;
          esac

          auth_json="$(curl --fail --silent --show-error \
            --user "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            --get 'https://auth.docker.io/token' \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:${registry_path}:pull,push,delete")"
          registry_token="$(jq -er '.token // .access_token' <<<"$auth_json")"
          jwt_payload="${registry_token#*.}"
          jwt_payload="${jwt_payload%%.*}"
          jwt_payload="$(tr '_-' '/+' <<<"$jwt_payload")"
          case $((${#jwt_payload} % 4)) in
            2) jwt_payload+='==' ;;
            3) jwt_payload+='=' ;;
          esac
          token_claims="$(base64 --decode <<<"$jwt_payload")"
          jq -e --arg repository "$registry_path" '
            any(.access[]?;
              .type == "repository" and .name == $repository and
              (.actions | index("pull")) != null and
              (.actions | index("push")) != null and
              (.actions | index("delete")) != null)
          ' <<<"$token_claims" >/dev/null
          echo "$DOCKERHUB_TOKEN" |
            docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

          dockerhub_tag_digest() {
            local tag="$1"
            local status digest
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://registry-1.docker.io/v2/${registry_path}/manifests/${tag}")"
            case "$status" in
              200)
                digest="$(docker buildx imagetools inspect \
                  "${dockerhub_repository}:${tag}" \
                  --format '{{ .Manifest.Digest }}')"
                [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                printf '%s\n' "$digest"
                ;;
              404) printf '%s\n' - ;;
              *) echo "unexpected Docker Hub status ${status} for ${tag}" >&2; return 1 ;;
            esac
          }

          dockerhub_snapshot="$state_dir/dockerhub-tag-snapshot"
          dockerhub_version_digest="$(dockerhub_tag_digest "$VERSION")"
          test "$dockerhub_version_digest" = -
          printf '%s\t%s\n' "$VERSION" "$dockerhub_version_digest" \
            >"$dockerhub_snapshot"
          if [ "$PRERELEASE" != true ]; then
            dockerhub_latest_digest="$(dockerhub_tag_digest latest)"
            printf '%s\t%s\n' latest "$dockerhub_latest_digest" \
              >>"$dockerhub_snapshot"
          fi
          touch "$state_dir/promotion-started"

      - name: Publish the exact multi-architecture images
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          FULL_VERSION: ${{ needs.validate.outputs.full_version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          CREATED: ${{ needs.validate.outputs.created }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          ghcr_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(
            --tag "${ghcr_repository}:${VERSION}"
            --tag "${DOCKERHUB_REPOSITORY}:${VERSION}"
          )
          if [ "$PRERELEASE" != true ]; then
            tags+=(
              --tag "${ghcr_repository}:latest"
              --tag "${DOCKERHUB_REPOSITORY}:latest"
            )
          fi
          # Keep the runnable index to the two supported platforms. The exact
          # verified index receives GitHub provenance in the attestation step.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --build-arg VERSION="$FULL_VERSION" \
            --build-arg COMMIT="${TARGET_SHA:0:8}" \
            --build-arg REVISION="$TARGET_SHA" \
            --build-arg CREATED="$CREATED" \
            --cache-from type=gha,scope=m-ui-image-amd64 \
            --cache-from type=gha,scope=m-ui-image-arm64 \
            "${tags[@]}" \
            --push .

      - name: Verify image identity and prepare release evidence
        id: formal-images
        env:
          FULL_VERSION: ${{ needs.validate.outputs.full_version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          ghcr_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect "${ghcr_repository}:${VERSION}" \
            --raw >release/IMAGE_MANIFEST.json
          jq -e '
            (.manifests | length) == 2 and
            ([.manifests[] | [.platform.os, .platform.architecture]] | sort) ==
              [["linux", "amd64"], ["linux", "arm64"]]
          ' release/IMAGE_MANIFEST.json
          dockerhub_manifest="$(mktemp)"
          docker buildx imagetools inspect \
            "${DOCKERHUB_REPOSITORY}:${VERSION}" --raw \
            >"$dockerhub_manifest"
          cmp release/IMAGE_MANIFEST.json "$dockerhub_manifest"
          while IFS=$'\t' read -r architecture platform_digest; do
            labels="$(docker buildx imagetools inspect \
              "${ghcr_repository}@${platform_digest}" \
              --format '{{json .Image.Config.Labels}}')"
            jq -e --arg revision "$TARGET_SHA" --arg version "$FULL_VERSION" '
              .["org.opencontainers.image.revision"] == $revision and
              .["org.opencontainers.image.version"] == $version
            ' <<<"$labels" >/dev/null
            echo "verified published identity for linux/${architecture}"
          done < <(jq -r '.manifests[] |
            [.platform.architecture, .digest] | @tsv' \
            release/IMAGE_MANIFEST.json)
          cp images/m-ui-image-*.sbom.spdx.json release/
          (
            cd release
            sha256sum IMAGE_MANIFEST.json \
              m-ui-image-*.sbom.spdx.json >>SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          ghcr_digest="$(
            docker buildx imagetools inspect "${ghcr_repository}:${VERSION}" \
              --format '{{ .Manifest.Digest }}'
          )"
          dockerhub_digest="$(
            docker buildx imagetools inspect \
              "${DOCKERHUB_REPOSITORY}:${VERSION}" \
              --format '{{ .Manifest.Digest }}'
          )"
          [[ "$ghcr_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$dockerhub_digest" = "$ghcr_digest"
          {
            printf 'ghcr_subject_name=%s\n' "$ghcr_repository"
            printf 'dockerhub_subject_name=%s\n' "$DOCKERHUB_REPOSITORY"
            printf 'subject_digest=%s\n' "$ghcr_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/*.apk
            release/SHA256SUMS
            release/ARTIFACT_SIZES.txt
            release/*.sbom.spdx.json
            release/manage.sh
            release/install.sh
            release/install-docker.sh
            release/uninstall.sh
            release/compose.yml
            release/IMAGE_MANIFEST.json
            release/MIHOMO_BOOTSTRAP_IDENTITY.json

      - name: Attest the GHCR multi-architecture image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.formal-images.outputs.ghcr_subject_name }}
          subject-digest: ${{ steps.formal-images.outputs.subject_digest }}

      - name: Attest the Docker Hub multi-architecture image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.formal-images.outputs.dockerhub_subject_name }}
          subject-digest: ${{ steps.formal-images.outputs.subject_digest }}

      - name: Create exact source tag and draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          state_dir="$RUNNER_TEMP/m-ui-release-state"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$TARGET_SHA" -m "m-ui $VERSION"
          git push origin "refs/tags/$VERSION"
          touch "$state_dir/tag-created"

          release_args=(
            "$VERSION"
            release/*
            --draft
            --target "$TARGET_SHA"
            --title "m-ui $VERSION"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
          touch "$state_dir/release-created"

      - name: Complete verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release edit "$VERSION" --draft=false
          touch "$RUNNER_TEMP/m-ui-release-state/release-complete"

      - name: Clean up failed release state
        if: ${{ always() }}
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
        run: |
          set +e
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          state_dir="$RUNNER_TEMP/m-ui-release-state"

          cleanup_status=success
          cleanup_summary=()
          declare -A deleted_version_ids=()

          note_cleanup() {
            cleanup_summary+=("$1")
          }

          owner="${GITHUB_REPOSITORY%%/*}"
          package="${GITHUB_REPOSITORY#*/}"
          package_versions_endpoint=
          owner_type="$(gh api "/users/${owner}" -q .type 2>/dev/null || true)"
          case "$owner_type" in
            User)
              package_versions_endpoint="/users/${owner}/packages/container/${package}/versions"
              ;;
            Organization)
              package_versions_endpoint="/orgs/${owner}/packages/container/${package}/versions"
              ;;
            *)
              echo "::warning::cannot resolve GitHub Packages owner type for ${owner}; automatic rollback is blocked"
              cleanup_status=blocked
              note_cleanup "owner type for ${owner} could not be resolved"
              ;;
          esac

          package_versions_file="$state_dir/package-versions.json"
          package_versions_flat="$state_dir/package-versions-flat.json"
          refresh_package_versions() {
            if [ -z "$package_versions_endpoint" ]; then
              return 1
            fi
            if ! gh api --paginate --slurp \
              "${package_versions_endpoint}?per_page=100" \
              >"$package_versions_file"; then
              return 1
            fi
            jq -e "add // []" "$package_versions_file" >"$package_versions_flat"
          }

          cleanup_package_tags() {
            local label="$1"
            shift
            local target_tag tag_record version_id non_allowed tags_json
            local allowed_json
            local target_tags=("$@")
            if [ -z "$package_versions_endpoint" ]; then
              cleanup_status=blocked
              note_cleanup "${label}: GitHub Packages API endpoint unavailable"
              return
            fi
            if ! refresh_package_versions; then
              echo "::warning::${label}: cannot enumerate GitHub Packages versions; no deletion attempted"
              cleanup_status=blocked
              note_cleanup "${label}: package version enumeration failed"
              return
            fi
            allowed_json="$(printf '%s\n' "${cleanup_allowed_tags[@]}" |
              jq -Rsc 'split("\n") | map(select(length > 0))')"
            for target_tag in "${target_tags[@]}"; do
              tag_record="$(jq -c --arg tag "$target_tag" \
                'map(select((.metadata.container.tags // []) | index($tag) != null)) | .[0] // empty' \
                "$package_versions_flat")"
              if [ -z "$tag_record" ]; then
                echo "::notice::${label}: ${target_tag} is absent"
                continue
              fi
              version_id="$(jq -r '.id // empty' <<<"$tag_record")"
              tags_json="$(jq -c '.metadata.container.tags // []' <<<"$tag_record")"
              non_allowed="$(jq -r --argjson allowed "$allowed_json" \
                '.metadata.container.tags // [] | map(. as $tag | select(($allowed | index($tag)) == null)) | .[]?' \
                <<<"$tag_record")"
              if [ -n "$non_allowed" ]; then
                echo "::warning::${label}: retaining ${target_tag};" \
                  "package version ${version_id} also has non-target tags:" \
                  "${non_allowed//$'\n'/, }"
                cleanup_status=blocked
                note_cleanup "${label}: ${target_tag} shares package version ${version_id} with non-target tags ${tags_json}"
                continue
              fi
              if [ -n "${deleted_version_ids[$version_id]:-}" ]; then
                continue
              fi
              if gh api --method DELETE \
                "${package_versions_endpoint}/${version_id}" >/dev/null; then
                deleted_version_ids[$version_id]=1
                echo "::notice::${label}: deleted package version ${version_id} containing only target tags ${tags_json}"
              else
                echo "::warning::${label}: failed to delete package version ${version_id}; target ${target_tag} retained"
                cleanup_status=blocked
                note_cleanup "${label}: deletion failed for package version ${version_id}"
              fi
            done
            if ! refresh_package_versions; then
              echo "::warning::${label}: cannot re-enumerate GitHub Packages versions for deletion verification"
              cleanup_status=blocked
              note_cleanup "${label}: post-delete enumeration failed"
              return
            fi
            for target_tag in "${target_tags[@]}"; do
              if jq -e --arg tag "$target_tag" \
                'any(.[]; (.metadata.container.tags // []) | index($tag) != null)' \
                "$package_versions_flat" >/dev/null; then
                echo "::warning::${label}: ${target_tag} still exists after cleanup"
                cleanup_status=blocked
                note_cleanup "${label}: ${target_tag} remains after deletion verification"
              else
                echo "::notice::${label}: verified ${target_tag} absent"
              fi
            done
          }

          new_formal_tags=()
          formal_restore_verified=true
          restore_formal_tag() {
            local tag="$1"
            local digest="$2"
            local restored_digest
            if ! docker buildx imagetools create \
              --tag "${repository}:${tag}" \
              "${repository}@${digest}"; then
              echo "::warning::failed to restore ${repository}:${tag} at ${digest}"
              formal_restore_verified=false
              return
            fi
            restored_digest="$(docker buildx imagetools inspect \
              "${repository}:${tag}" --format '{{ .Manifest.Digest }}' 2>/dev/null)"
            if [ "$restored_digest" != "$digest" ]; then
              echo "::warning::restored ${repository}:${tag} has digest ${restored_digest}, expected ${digest}"
              formal_restore_verified=false
            fi
          }
          if [ -f "$state_dir/promotion-started" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            snapshot="$state_dir/formal-tag-snapshot"
            if [ -r "$snapshot" ]; then
              while IFS=$'\t' read -r tag digest; do
                [ -n "$tag" ] || continue
                if [ "$digest" != "-" ]; then
                  if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                    echo "::warning::formal tag snapshot contains invalid digest for ${tag}: ${digest}"
                    formal_restore_verified=false
                    continue
                  fi
                  restore_formal_tag "$tag" "$digest"
                else
                  new_formal_tags+=("$tag")
                fi
              done <"$snapshot"
            else
              echo "::warning::formal tag snapshot is unavailable; no failed-promotion package version deletion will be attempted"
              cleanup_status=blocked
              note_cleanup "failed promotion: formal tag snapshot unavailable"
              formal_restore_verified=false
            fi
          fi

          if [ "$formal_restore_verified" != true ]; then
            cleanup_status=blocked
            note_cleanup "failed promotion: formal tag restoration was not verified; failed-promotion deletion skipped"
            new_formal_tags=()
          fi
          cleanup_allowed_tags=("${new_formal_tags[@]}")
          if [ "$formal_restore_verified" = true ] && [ "${#new_formal_tags[@]}" -gt 0 ]; then
            cleanup_package_tags "failed-promotion cleanup" "${new_formal_tags[@]}"
          fi

          release_cleanup_safe=true
          if [ -f "$state_dir/release-created" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            draft="$(gh release view "$VERSION" --json isDraft -q .isDraft 2>/dev/null)"
            if [ "$draft" = true ]; then
              if ! gh release delete "$VERSION" --yes; then
                release_cleanup_safe=false
                cleanup_status=blocked
                note_cleanup "draft Release deletion failed"
              fi
            else
              echo "::warning::formal release $VERSION is public; manual cleanup is required"
              release_cleanup_safe=false
              cleanup_status=blocked
              note_cleanup "public Release was preserved"
            fi
          fi
          if [ -f "$state_dir/tag-created" ] &&
              [ ! -f "$state_dir/release-complete" ]; then
            remote_target="$(git ls-remote origin "refs/tags/${VERSION}^{}" |
              awk 'NR == 1 {print $1}')"
            if [ "$release_cleanup_safe" = true ] &&
                [ "$remote_target" = "$TARGET_SHA" ]; then
              if git push origin ":refs/tags/$VERSION"; then
                note_cleanup "rolled back refs/tags/$VERSION"
              else
                cleanup_status=blocked
                note_cleanup "failed to roll back refs/tags/$VERSION"
              fi
            else
              cleanup_status=blocked
              note_cleanup "refs/tags/$VERSION identity was not safe to roll back"
            fi
          fi

          if [ -f "$state_dir/promotion-started" ] &&
              [ ! -f "$state_dir/release-complete" ] &&
              [ -r "$state_dir/dockerhub-tag-snapshot" ]; then
            dockerhub_repository="$(cat "$state_dir/dockerhub-repository")"
            if ! echo "$DOCKERHUB_TOKEN" | docker login docker.io \
              -u "$DOCKERHUB_USERNAME" --password-stdin; then
              cleanup_status=blocked
              note_cleanup "Docker Hub authentication failed during rollback"
            else
              dockerhub_tag_digest() {
                local tag="$1"
                docker buildx imagetools inspect \
                  "${dockerhub_repository}:${tag}" \
                  --format '{{ .Manifest.Digest }}' 2>/dev/null || printf %s -
              }

              declare -A dockerhub_prior=()
              dockerhub_restore_verified=true
              while IFS=$'\t' read -r tag digest; do
                dockerhub_prior[$tag]="$digest"
                if [ "$digest" = - ]; then
                  if ! regctl tag delete --ignore-missing \
                    "${dockerhub_repository}:${tag}"; then
                    dockerhub_restore_verified=false
                  fi
                elif ! docker buildx imagetools create \
                  --tag "${dockerhub_repository}:${tag}" \
                  "${dockerhub_repository}@${digest}"; then
                  dockerhub_restore_verified=false
                fi
              done <"$state_dir/dockerhub-tag-snapshot"

              if [ "$dockerhub_restore_verified" != true ]; then
                cleanup_status=blocked
                note_cleanup "Docker Hub prior tags were not restored"
              fi

              for tag in "${!dockerhub_prior[@]}"; do
                current="$(dockerhub_tag_digest "$tag")"
                if [ "$current" != "${dockerhub_prior[$tag]}" ]; then
                  cleanup_status=blocked
                  note_cleanup "Docker Hub tag ${tag} was not restored"
                fi
              done
            fi
          fi
          {
            echo '### Release cleanup'
            if [ "$cleanup_status" = success ]; then
              echo '- rollback cleanup status: success'
            else
              echo '- rollback cleanup status: blocked or incomplete'
            fi
            if [ "${#cleanup_summary[@]}" -gt 0 ]; then
              for note in "${cleanup_summary[@]}"; do
                echo "- $note"
              done
            fi
            if [ -f "$state_dir/release-complete" ]; then
              echo '- formal release marker: complete'
            else
              echo '- formal release marker: incomplete'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$cleanup_status" != success ]; then
            echo '::warning::formal publication may be complete, but release cleanup was not fully completed safely; see the job summary'
          fi

  complete:
    if: ${{ always() }}
    needs:
      - validate
      - verify
      - policy
      - golangci-lint
      - bootstrap
      - assets
      - image
      - package-test
      - mirror
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Enforce the selected mode contract
        env:
          MODE: ${{ needs.validate.outputs.mode }}
          VALIDATE: ${{ needs.validate.result }}
          VERIFY: ${{ needs.verify.result }}
          POLICY: ${{ needs.policy.result }}
          GOLANGCI: ${{ needs.golangci-lint.result }}
          BOOTSTRAP: ${{ needs.bootstrap.result }}
          ASSETS: ${{ needs.assets.result }}
          IMAGE: ${{ needs.image.result }}
          PACKAGE_TEST: ${{ needs.package-test.result }}
          MIRROR: ${{ needs.mirror.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          test "$VALIDATE" = success
          case "$MODE" in
            test)
              test "$VERIFY" = success
              test "$POLICY" = success
              test "$GOLANGCI" = success
              test "$BOOTSTRAP" = skipped
              test "$ASSETS" = skipped
              test "$IMAGE" = skipped
              test "$PACKAGE_TEST" = skipped
              test "$MIRROR" = skipped
              test "$PUBLISH" = skipped
              ;;
            build)
              test "$VERIFY" = success
              test "$POLICY" = success
              test "$GOLANGCI" = success
              test "$BOOTSTRAP" = success
              test "$ASSETS" = success
              test "$IMAGE" = success
              test "$PACKAGE_TEST" = success
              test "$MIRROR" = skipped
              test "$PUBLISH" = skipped
              ;;
            mirror)
              test "$VERIFY" = skipped
              test "$POLICY" = skipped
              test "$GOLANGCI" = skipped
              test "$BOOTSTRAP" = skipped
              test "$ASSETS" = skipped
              test "$IMAGE" = skipped
              test "$PACKAGE_TEST" = skipped
              test "$MIRROR" = success
              test "$PUBLISH" = skipped
              ;;
            release)
              test "$VERIFY" = success
              test "$POLICY" = success
              test "$GOLANGCI" = success
              test "$BOOTSTRAP" = success
              test "$ASSETS" = success
              test "$IMAGE" = success
              test "$PACKAGE_TEST" = success
              test "$MIRROR" = skipped
              test "$PUBLISH" = success
              ;;
            *)
              echo "unknown or unavailable workflow mode: $MODE" >&2
              exit 1
              ;;
          esac
          {
            echo '### Smart workflow result'
            echo "- mode: $MODE"
            echo '- source verification: passed'
            if [ "$MODE" = build ] || [ "$MODE" = release ]; then
              echo '- native assets and Docker images: passed'
            fi
            if [ "$MODE" = mirror ]; then
              echo '- verified Docker Hub mirror: passed'
            fi
            if [ "$MODE" = release ]; then
              echo '- GitHub Release, GHCR, and Docker Hub publication: passed'
            fi
          } >>"$GITHUB_STEP_SUMMARY"
