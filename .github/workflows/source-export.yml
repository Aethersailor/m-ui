name: Temporary source export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create m-ui.bundle --all
          git bundle verify m-ui.bundle

      - name: Upload Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-source-bundle
          path: m-ui.bundle
          if-no-files-found: error
          retention-days: 1

  devkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Download Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download

      - name: Package offline Go development kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p devkit
          printf '%s\n' "$(go env GOROOT)" > devkit/goroot-path.txt
          printf '%s\n' "$(go env GOMODCACHE)" > devkit/gomodcache-path.txt
          tar -C "$(dirname "$(go env GOROOT)")" -czf devkit/goroot.tar.gz "$(basename "$(go env GOROOT)")"
          tar -C "$(dirname "$(go env GOMODCACHE)")" -czf devkit/gomodcache.tar.gz "$(basename "$(go env GOMODCACHE)")"

      - name: Upload offline Go development kit
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-go-devkit
          path: devkit
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  nodekit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exact frontend dependencies
        run: npm --prefix web ci

      - name: Package offline Node development kit
        shell: bash
        run: |
          set -euo pipefail
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          mkdir -p nodekit
          tar -C "$(dirname "$node_root")" -czf nodekit/node-root.tar.gz "$(basename "$node_root")"
          tar -C web -czf nodekit/node-modules.tar.gz node_modules

      - name: Upload offline Node development kit
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-node-devkit
          path: nodekit
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  action-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve selected action tags to immutable commits
        shell: bash
        run: |
          set -euo pipefail
          resolve() {
            repository="$1"
            tag="$2"
            sha="$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}^{}" | awk 'NR == 1 {print $1}')"
            if [ -z "$sha" ]; then
              sha="$(git ls-remote "https://github.com/${repository}.git" "refs/tags/${tag}" | awk 'NR == 1 {print $1}')"
            fi
            test -n "$sha"
            printf '%s %s %s\n' "$repository" "$tag" "$sha" >> action-lock.txt
          }
          resolve actions/checkout v5
          resolve actions/setup-go v6
          resolve actions/setup-node v5
          resolve actions/upload-artifact v4
          resolve actions/download-artifact v5
          resolve actions/attest-build-provenance v3
          resolve docker/setup-qemu-action v3
          resolve docker/setup-buildx-action v3
          resolve docker/login-action v3
          resolve docker/metadata-action v6
          resolve docker/build-push-action v6
          resolve golangci/golangci-lint-action v9
          resolve anchore/sbom-action v0
          cat action-lock.txt

      - name: Upload action lock
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-action-lock
          path: action-lock.txt
          if-no-files-found: error
          retention-days: 1
