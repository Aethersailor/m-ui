name: Temporary source export

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Git bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git bundle create m-ui.bundle --all
          git bundle verify m-ui.bundle

      - name: Upload Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-source-bundle
          path: m-ui.bundle
          if-no-files-found: error
          retention-days: 1

  devkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: false

      - name: Download Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download

      - name: Package offline Go development kit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p devkit
          printf '%s\n' "$(go env GOROOT)" > devkit/goroot-path.txt
          printf '%s\n' "$(go env GOMODCACHE)" > devkit/gomodcache-path.txt
          tar -C "$(dirname "$(go env GOROOT)")" -czf devkit/goroot.tar.gz "$(basename "$(go env GOROOT)")"
          tar -C "$(dirname "$(go env GOMODCACHE)")" -czf devkit/gomodcache.tar.gz "$(basename "$(go env GOMODCACHE)")"

      - name: Upload offline Go development kit
        uses: actions/upload-artifact@v4
        with:
          name: m-ui-go-devkit
          path: devkit
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
