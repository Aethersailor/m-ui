version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "02:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    rebase-strategy: auto
    commit-message:
      prefix: ci

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "02:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    rebase-strategy: auto
    commit-message:
      prefix: build(go)

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
      time: "02:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    rebase-strategy: auto
    versioning-strategy: increase
    commit-message:
      prefix: build(web)
    # TypeScript 7 is outside typescript-eslint 8.66's supported peer range.
    # Dependabot should resume proposing compatible 6.x updates automatically.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "02:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    rebase-strategy: auto
    commit-message:
      prefix: build(docker)
